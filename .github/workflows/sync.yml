name: Sync Orca skills

on:
  schedule:
    - cron: "0 9 * * 1"
      timezone: "Asia/Taipei"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-orca-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Sync upstream skills
        run: node scripts/sync.mjs

      - name: Test sync guardrails
        run: node --test scripts/sync.test.mjs

      - name: Commit and push an update
        run: |
          git add --all -- skills UPSTREAM.json
          if git diff --cached --quiet; then
            echo "Orca skills are already up to date."
            exit 0
          fi

          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Orca skills"
          git push origin HEAD:main
